name: Publish existing release to CurseForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub release tag to publish to CurseForge only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-retry-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG_FILE: release-artifacts/changelog.md
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Download the existing CurseForge artifact and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh release download "$VERSION" --pattern "vintage-resourcify-${VERSION}-curseforge.jar" --dir release-artifacts
          gh release view "$VERSION" --json body --jq .body > "$CHANGELOG_FILE"
          sha256sum "release-artifacts/vintage-resourcify-${VERSION}-curseforge.jar"
      - name: Publish only to CurseForge without rebuilding the jar
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: >-
          ./gradlew publishCurseforge --no-configuration-cache --console=plain
          -PcurseForgeArtifact="release-artifacts/vintage-resourcify-${VERSION}-curseforge.jar"
